name: Release

# 태그 v1.2.3 을 푸시하면 빌드 → (선택) Developer ID 서명·공증 → zip/DMG → GitHub Release 생성
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # 선택 사항: 아래 secrets가 있으면 Developer ID 서명 + 공증까지 수행
      #   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build app bundle (ad-hoc signed)
        run: ./build.sh

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.MACOS_CERT_P12_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmp build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
          rm cert.p12

      - name: Sign with Developer ID and notarize
        if: env.HAS_SIGNING == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          codesign --force --deep --options runtime --timestamp --entitlements LiveSubtitle.entitlements --sign "$IDENTITY" build/LiveSubtitle.app
          ditto -c -k --keepParent build/LiveSubtitle.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
          xcrun stapler staple build/LiveSubtitle.app
          rm notarize.zip

      - name: Package zip and DMG
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/LiveSubtitle.app "dist/LiveSubtitle-${{ steps.ver.outputs.version }}-macos-arm64.zip"
          mkdir -p dmgroot && cp -R build/LiveSubtitle.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "LiveSubtitle" -srcfolder dmgroot -ov -format UDZO "dist/LiveSubtitle-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            echo "## LiveSubtitle ${{ steps.ver.outputs.tag }}"
            echo
            echo "실시간 영어 → 한국어 자막 (macOS 메뉴바 앱, 기기 내 인식·번역)."
            echo
            echo "### 설치"
            echo "1. DMG를 열고 LiveSubtitle을 Applications로 드래그"
            echo "2. 요구사항: Apple Silicon 맥, macOS 15 이상 (Apple 내장 엔진은 macOS 26)"
            if [ "$HAS_SIGNING" != "true" ]; then
              echo "3. 이 빌드는 공증되지 않았습니다. 처음 열 때 경고가 뜨면 **시스템 설정 > 개인정보 보호 및 보안 > 그래도 열기**, 또는 터미널에서 \`xattr -dr com.apple.quarantine /Applications/LiveSubtitle.app\`"
            fi
            echo "4. 첫 실행은 인터넷 연결 상태에서: 마이크 권한 → 번역 언어 다운로드 → Parakeet 모델(452MB) 자동 다운로드"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LiveSubtitle ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: dist/*
